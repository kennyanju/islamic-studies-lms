name = "islamic-studies-lms"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Static Assets
[assets]
directory = "./public"

# Default Cloudflare D1 Serverless SQL Database Binding
[[d1_databases]]
binding = "DB"
database_name = "islamic-studies-db"
database_id = "da41214f-fa8a-4b74-a285-15067db9a7d2"
migrations_dir = "migrations"

# Cloudflare KV Namespace for Parent Login Lockout Defense
[[kv_namespaces]]
binding = "LOGIN_KV"
id = "51bc45ac6a964d2d8eedf1820f295e24"

# -----------------------------------------------------------------------------
# Staging Environment
# -----------------------------------------------------------------------------
[env.staging]
name = "islamic-studies-lms-staging"
[env.staging.assets]
directory = "./public"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "islamic-studies-db"
database_id = "da41214f-fa8a-4b74-a285-15067db9a7d2"
migrations_dir = "migrations"
[[env.staging.kv_namespaces]]
binding = "LOGIN_KV"
id = "51bc45ac6a964d2d8eedf1820f295e24"

# -----------------------------------------------------------------------------
# Production Environment
# -----------------------------------------------------------------------------
[env.production]
name = "islamic-studies-lms"
[env.production.assets]
directory = "./public"
[[env.production.d1_databases]]
binding = "DB"
database_name = "islamic-studies-db"
database_id = "da41214f-fa8a-4b74-a285-15067db9a7d2"
migrations_dir = "migrations"
[[env.production.kv_namespaces]]
binding = "LOGIN_KV"
id = "51bc45ac6a964d2d8eedf1820f295e24"

