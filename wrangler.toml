name = "islamic-studies-lms"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Static Assets
[assets]
directory = "./public"


# Cloudflare D1 Serverless SQL Database Binding
# Local preview defaults to preview database ID; replace with production database_id from Cloudflare dashboard
[[d1_databases]]
binding = "DB"
database_name = "islamic-studies-db"
database_id = "local-preview-id"
migrations_dir = "migrations"


