<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Islamic Studies LMS - API Documentation</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css"
    />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #090d16;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .topbar {
        display: none !important;
      }
      .custom-header {
        background: #0d1322;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .custom-header a {
        color: #10b981;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .custom-header a:hover {
        text-decoration: underline;
      }
      .swagger-ui .info .title {
        color: #10b981;
      }
    </style>
  </head>
  <body>
    <div class="custom-header">
      <a href="/">← Back to Islamic Studies Portal</a>
      <span style="color: #94a3b8; font-size: 0.9rem">OpenAPI 3.0 Specification</span>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script>
      window.onload = function () {
        SwaggerUIBundle({
          url: '/openapi.json',
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
          layout: 'BaseLayout'
        });
      };
    </script>
  </body>
</html>
