<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Islamic Geometric Accent Border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.35"/>
  
  <!-- Emerald Crescent / Arch Motif -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.85" filter="url(#glow)"/>
  
  <!-- Central Kaaba Cube Representation -->
  <g transform="translate(156, 170)">
    <!-- Base Cube -->
    <rect x="20" y="30" width="160" height="150" rx="16" fill="#090d16" stroke="#f59e0b" stroke-width="6"/>
    <!-- Gold Kiswa Belt (Hizam) -->
    <rect x="20" y="65" width="160" height="24" fill="url(#goldGrad)"/>
    <!-- Gold Door (Bab al-Kaaba) -->
    <rect x="110" y="105" width="45" height="75" rx="6" fill="url(#goldGrad)"/>
    <!-- Subtle Roof Cap -->
    <path d="M 20 30 L 100 0 L 180 30 Z" fill="#047857" opacity="0.8"/>
  </g>
  
  <!-- Star / Sparkle Accents -->
  <polygon points="256,70 262,85 278,85 265,95 270,110 256,100 242,110 247,95 234,85 250,85" fill="url(#goldGrad)"/>
</svg>